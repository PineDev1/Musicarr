services:
  musicarr:
    build: .
    image: musicarr:1.4
    container_name: musicarr
    ports:
      - "8787:8787"
    volumes:
      - ./data:/config
      - ./music:/music
      # Shared completed downloads for indexer → qBit/SAB import (optional)
      - ./downloads:/downloads
    environment:
      MUSICARR_DATA_DIR: /config
      MUSICARR_MUSIC_DIR: /music
      MUSICARR_HOST: 0.0.0.0
      MUSICARR_PORT: 8787
    restart: unless-stopped
