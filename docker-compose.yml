services:
  musicarr:
    build: .
    image: musicarr:1.7
    container_name: musicarr
    ports:
      - "8787:8787"
    volumes:
      - ./data:/config
      - ./music:/music
    environment:
      MUSICARR_DATA_DIR: /config
      MUSICARR_MUSIC_DIR: /music
      MUSICARR_HOST: 0.0.0.0
      MUSICARR_PORT: 8787
      # Optional — only needed if a download client (qBittorrent/SABnzbd) runs in
      # a different container/host and reports paths Musicarr can't read as-is.
      # See README's "Remote path mappings" section.
      # MUSICARR_REMOTE_PATH_MAPPINGS: >-
      #   [{"host": "qbittorrent", "remote_path": "/downloads", "local_path": "/config/downloads"}]
    restart: unless-stopped
