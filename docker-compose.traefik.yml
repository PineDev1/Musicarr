# Example: Musicarr behind Traefik (TLS terminated by Traefik)
#
# Prerequisites:
# - An existing Traefik instance on the `proxy` network with a cert resolver
#   named `letsencrypt` (change labels if yours differs).
# - DNS for your domain pointing at Traefik.
#
# Usage:
#   1. Edit MUSICARR_DOMAIN below (or export it).
#   2. docker compose -f docker-compose.traefik.yml up -d
#   3. In Musicarr → Settings → Security:
#        - Enable app login
#        - Enable “Behind HTTPS (Traefik terminates SSL)”
#        - Set Public domain to the same host
#
# Musicarr still listens on HTTP :8787 inside the container.
# Do not publish 8787 on the host when Traefik is the only entrypoint.

services:
  musicarr:
    build: .
    image: musicarr:1.4
    container_name: musicarr
    volumes:
      - ./data:/config
      - ./music:/music
    environment:
      MUSICARR_DATA_DIR: /config
      MUSICARR_MUSIC_DIR: /music
      MUSICARR_HOST: 0.0.0.0
      MUSICARR_PORT: 8787
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.musicarr.rule=Host(`${MUSICARR_DOMAIN:-music.example.com}`)
      - traefik.http.routers.musicarr.entrypoints=websecure
      - traefik.http.routers.musicarr.tls=true
      - traefik.http.routers.musicarr.tls.certresolver=letsencrypt
      - traefik.http.services.musicarr.loadbalancer.server.port=8787
    restart: unless-stopped

networks:
  proxy:
    external: true
